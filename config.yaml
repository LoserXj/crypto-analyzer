okx:
  base_url: "https://www.okx.com/api/v5/market"
  default_pairs:
    - "BTC-USDT"
    - "ETH-USDT"
    - "SOL-USDT"
  default_timeframe: "4H"
  valid_bars:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1H"
    - "2H"
    - "4H"
    - "6H"
    - "12H"
    - "1D"
    - "1W"

watch:
  interval: 300
  pairs:
    - "BTC-USDT"

notify:
  wechat:
    enabled: false
    method: "serverchan"
    # token 从环境变量 WECHAT_TOKEN 读取
  macos: true

journal:
  enabled: true
  file: "data/trades.json"

ai_reflection:
  enabled: false
  schedule: "weekly"
  # api_key 从环境变量 ANTHROPIC_API_KEY 读取
